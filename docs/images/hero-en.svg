<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">PocketSocket — Discord için ayrı yol</title><desc id="desc">Seçilen Discord uygulaması VPN tunnelnden, oyun ve diğer uygulamalar doğrudan internetten çıkar. macOS için beta sürüm.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#315e47" stroke-width="1.5"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="510" rx="28" fill="#193c2c" stroke="none"/><circle cx="1110" cy="30" r="240" fill="none" stroke="#28513a" stroke-width="70"/><circle cx="1090" cy="20" r="130" fill="none" stroke="#356043" stroke-width="1"/><rect x="42" y="37" width="58" height="58" rx="16" fill="#d8ecaa" stroke="none"/><text x="59" y="80" font-size="51" fill="#193c2c" font-weight="750" >p</text><text x="116" y="78" font-size="32" fill="#f4f6ec" font-weight="650" >PocketSocket</text><rect x="962" y="43" width="193" height="38" rx="19" fill="#31543c" stroke="none"/><text x="1058" y="69" font-size="19" fill="#d8ecaa" font-weight="650" text-anchor="middle">DESKTOP BETA</text><text x="44" y="163" font-size="57" fill="#fff" font-weight="650" >Your apps. Your routes.</text><text x="44" y="230" font-size="57" fill="#d8ecaa" font-weight="650" >Keep your games direct.</text><text x="46" y="278" font-size="24" fill="#b9cbbb" font-weight="450" >Bring your connection. Choose your apps. Connect.</text><rect x="43" y="320" width="1114" height="68" rx="16" fill="#254b36" stroke="none"/><g transform="translate(74 334) scale(.55)"><g transform="translate(0 0)" fill="none" stroke="#d8ecaa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 0h66q8 0 8 8v42q0 8-8 8H32L14 72V58H8q-8 0-8-8V8q0-8 8-8Z"/><path d="M21 24h40M21 36h27"/></g></g><text x="175" y="363" font-size="26" fill="#fff" font-weight="600" >Discord</text><path d="M340 354h480" stroke="#8cab6a" stroke-width="2" stroke-dasharray="7 8"/><path d="m810 346 12 8-12 8" fill="none" stroke="#d8ecaa" stroke-width="2"/><rect x="850" y="335" width="280" height="38" rx="12" fill="#d8ecaa" stroke="none"/><text x="990" y="361" font-size="22" fill="#193c2c" font-weight="650" text-anchor="middle">VPN tunnel</text><rect x="43" y="403" width="1114" height="68" rx="16" fill="#224632" stroke="none"/><path d="M77 437h42m-12-12 13 12-13 12" stroke="#a8bca6" stroke-width="3" fill="none"/><text x="175" y="446" font-size="25" fill="#e3e9db" font-weight="550" >Games and everything else</text><path d="M490 437h330" stroke="#698970" stroke-width="2" stroke-dasharray="7 8"/><path d="m810 429 12 8-12 8" fill="none" stroke="#a8bca6" stroke-width="2"/><rect x="850" y="418" width="280" height="38" rx="12" fill="#36563c" stroke="none"/><text x="990" y="444" font-size="22" fill="#e3e9db" font-weight="550" text-anchor="middle">Direct internet</text></g></svg>