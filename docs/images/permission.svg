<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc"><title id="title">Mac uygulamayı engellerse</title><desc id="desc">Applications’a taşı, uygulamayı bir kez açmayı dene. Sistem Ayarları, Gizlilik ve Güvenlik bölümündeki Yine de Aç düğmesini kullan. Bu görsel adımların şemasıdır.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#315e47" stroke-width="1.5"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="210" rx="24" fill="#fbf3e4" stroke="none"/><path d="m62 52 39-13 39 13v38q0 36-39 53-39-17-39-53Z" fill="#f2dfb6" stroke="#9b7740" stroke-width="3"/><path d="M101 63v29m0 14v3" stroke="#9b7740" stroke-width="5" stroke-linecap="round"/><text x="174" y="72" font-size="30" fill="#243d30" font-weight="650" >Mac izin istiyorsa</text><text x="174" y="116" font-size="26" fill="#69786a" font-weight="500" >Sistem Ayarları → Gizlilik ve Güvenlik</text><rect x="900" y="74" width="258" height="64" rx="14" fill="#315e47" stroke="none"/><text x="1029" y="116" font-size="27" fill="#fff" font-weight="650" text-anchor="middle">Yine de Aç</text><text x="174" y="170" font-size="23" fill="#927143" font-weight="500" >Hasarlı uyarısı sürerse aşağıdaki çözümü uygula.</text></g></svg>