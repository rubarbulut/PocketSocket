<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Mac’ine uygun paketi seç</title><desc id="desc">A18 Pro kullanan MacBook Neo ve M serisi Mac için arm64. Intel işlemcili Mac için x64. İşlemcini Apple menüsündeki Bu Mac Hakkında ekranından bul.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#315e47" stroke-width="1.5"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="300" rx="24" fill="#f5f5ee" stroke="none"/><rect x="20" y="20" width="568" height="260" rx="18" fill="#e9efdc" stroke="#d2ddbd"/><rect x="612" y="20" width="568" height="260" rx="18" fill="#fff" stroke="#dde2d6"/><g transform="translate(52 50) scale(0.8)" fill="none" stroke="#315e47" stroke-width="3.5" stroke-linejoin="round"><rect x="10" y="0" width="90" height="60" rx="7"/><path d="M10 60 0 74h110l-10-14M42 74h26"/><path d="M40 25h30M40 35h20"/></g><text x="170" y="76" font-size="30" fill="#243d30" font-weight="650" >Apple Silicon</text><text x="170" y="114" font-size="23" fill="#69786a" font-weight="500" >M serisi + MacBook Neo</text><text x="53" y="181" font-size="25" fill="#243d30" font-weight="550" >M1, M2, M3… veya A18 Pro</text><rect x="52" y="211" width="501" height="47" rx="12" fill="#315e47" stroke="none"/><text x="302" y="242" font-size="24" fill="#fff" font-weight="650" text-anchor="middle">PocketSocket-mac-arm64</text><g transform="translate(644 50) scale(0.8)" fill="none" stroke="#7b8276" stroke-width="3.5" stroke-linejoin="round"><rect x="10" y="0" width="90" height="60" rx="7"/><path d="M10 60 0 74h110l-10-14M42 74h26"/><path d="M40 25h30M40 35h20"/></g><text x="762" y="76" font-size="30" fill="#243d30" font-weight="650" >Intel</text><text x="762" y="114" font-size="23" fill="#69786a" font-weight="500" >Intel işlemcili Mac</text><text x="645" y="181" font-size="25" fill="#243d30" font-weight="550" >İşlemci bilgisinde “Intel” yazar</text><rect x="644" y="211" width="501" height="47" rx="12" fill="#e9ece2" stroke="none"/><text x="894" y="242" font-size="24" fill="#243d30" font-weight="650" text-anchor="middle">PocketSocket-mac-x64</text></g></svg>