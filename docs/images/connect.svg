<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Dört adımda Discord bağlantısı</title><desc id="desc">Bir: WireGuard dosyasını seç. İki: Discord’u işaretle. Üç: Bağlan’a bas ve macOS izin penceresini onayla. Dört: Discord’u Command Q ile tamamen kapatıp yeniden aç.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#315e47" stroke-width="1.5"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="330" rx="24" fill="#f5f5ee" stroke="none"/><rect x="18" y="18" width="264" height="294" rx="18" fill="#fff" stroke="#dce2d2"/><circle cx="54" cy="54" r="21" fill="#315e47"/><text x="54" y="61" font-size="22" fill="#fff" font-weight="650" text-anchor="middle">1</text><rect x="318" y="18" width="264" height="294" rx="18" fill="#fff" stroke="#dce2d2"/><circle cx="354" cy="54" r="21" fill="#315e47"/><text x="354" y="61" font-size="22" fill="#fff" font-weight="650" text-anchor="middle">2</text><rect x="618" y="18" width="264" height="294" rx="18" fill="#fff" stroke="#dce2d2"/><circle cx="654" cy="54" r="21" fill="#315e47"/><text x="654" y="61" font-size="22" fill="#fff" font-weight="650" text-anchor="middle">3</text><rect x="918" y="18" width="264" height="294" rx="18" fill="#fff" stroke="#dce2d2"/><circle cx="954" cy="54" r="21" fill="#315e47"/><text x="954" y="61" font-size="22" fill="#fff" font-weight="650" text-anchor="middle">4</text><g transform="translate(109 83) scale(0.88)"><path d="M0 8Q0 0 8 0h45l19 20v64q0 8-8 8H8q-8 0-8-8Z" fill="#f6f8ef" stroke="#315e47" stroke-width="3"/><path d="M53 0v20h19" fill="none" stroke="#315e47" stroke-width="3"/><text x="36" y="61" font-size="18" fill="#315e47" font-weight="700" text-anchor="middle">.conf</text></g><text x="150" y="216" font-size="25" fill="#243d30" font-weight="650" text-anchor="middle">Dosyanı seç</text><text x="150" y="250" font-size="21" fill="#69786a" font-weight="450" text-anchor="middle">WireGuard profili</text><g transform="translate(406 88)" fill="none" stroke="#315e47" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 0h66q8 0 8 8v42q0 8-8 8H32L14 72V58H8q-8 0-8-8V8q0-8 8-8Z"/><path d="M21 24h40M21 36h27"/></g><rect x="357" y="175" width="185" height="54" rx="12" fill="#eaf0df" stroke="#abc18a"/><rect x="374" y="191" width="23" height="23" rx="5" fill="#315e47" stroke="none"/><path d="m379 202 5 5 9-12" stroke="#fff" stroke-width="2.5" fill="none"/><text x="410" y="211" font-size="24" fill="#243d30" font-weight="600" >Discord</text><text x="450" y="267" font-size="23" fill="#69786a" font-weight="450" text-anchor="middle">Discord’u işaretle</text><rect x="651" y="97" width="198" height="65" rx="14" fill="#315e47" stroke="none"/><text x="750" y="140" font-size="29" fill="#fff" font-weight="650" text-anchor="middle">Bağlan ↗</text><text x="750" y="216" font-size="25" fill="#243d30" font-weight="650" text-anchor="middle">Bağlan’a bas</text><text x="750" y="250" font-size="21" fill="#69786a" font-weight="450" text-anchor="middle">macOS iznini onayla</text><rect x="967" y="99" width="166" height="63" rx="13" fill="#eaf0df" stroke="none"/><text x="1050" y="141" font-size="31" fill="#315e47" font-weight="650" text-anchor="middle">⌘ + Q</text><text x="1050" y="216" font-size="25" fill="#243d30" font-weight="650" text-anchor="middle">Kapat → aç</text><text x="1050" y="250" font-size="20" fill="#69786a" font-weight="450" text-anchor="middle">Sonra ses kanalını dene</text></g></svg>