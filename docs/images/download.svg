<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc"><title id="title">GitHub’dan indirmek için dört adım</title><desc id="desc">Actions sekmesini aç, macOS beta altında yeşil tikli çalışmayı seç, Artifacts bölümüne in ve Mac’ine uygun PocketSocket paketini indir.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#315e47" stroke-width="1.5"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="190" rx="24" fill="#f5f5ee" stroke="none"/><circle cx="49" cy="41" r="21" fill="#315e47"/><text x="49" y="48" font-size="22" fill="#fff" font-weight="650" text-anchor="middle">1</text><circle cx="349" cy="41" r="21" fill="#315e47"/><text x="349" y="48" font-size="22" fill="#fff" font-weight="650" text-anchor="middle">2</text><circle cx="649" cy="41" r="21" fill="#315e47"/><text x="649" y="48" font-size="22" fill="#fff" font-weight="650" text-anchor="middle">3</text><circle cx="949" cy="41" r="21" fill="#315e47"/><text x="949" y="48" font-size="22" fill="#fff" font-weight="650" text-anchor="middle">4</text><text x="80" y="49" font-size="26" fill="#243d30" font-weight="650" >Actions</text><text x="380" y="49" font-size="26" fill="#243d30" font-weight="650" >Yeşil tikli iş</text><text x="680" y="49" font-size="26" fill="#243d30" font-weight="650" >Artifacts</text><text x="980" y="49" font-size="26" fill="#243d30" font-weight="650" >Paketi indir</text><rect x="24" y="80" width="240" height="74" rx="12" fill="#fff" stroke="#d9dfd0"/><text x="144" y="125" font-size="24" fill="#315e47" font-weight="600" text-anchor="middle">macOS beta</text><rect x="324" y="80" width="240" height="74" rx="12" fill="#fff" stroke="#d9dfd0"/><text x="444" y="125" font-size="24" fill="#315e47" font-weight="600" text-anchor="middle">✓ Başarılı</text><rect x="624" y